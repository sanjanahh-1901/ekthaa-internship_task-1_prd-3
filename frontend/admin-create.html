<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Create Meetup – Converge</title>
  <meta name="description" content="Admin: create or edit a community meetup event.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="create">

  <!-- NAV -->
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">
      <div class="logo-icon"></div>
      <span class="grad-text">Converge</span>
    </a>
    <div class="navbar-right">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm">← Back</a>
      <div id="nav-user"></div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container" style="padding-top:2rem;padding-bottom:4rem">
    <div style="max-width:740px;margin:0 auto">

      <div class="page-header fade-up">
        <h1 class="page-title" id="page-title">Create Meetup</h1>
        <p class="page-subtitle">Set up a new community event</p>
      </div>

      <form id="meetup-form" class="card fade-up-1">
        <div class="card-body" style="display:flex;flex-direction:column;gap:0">

          <!-- Banner upload -->
          <div class="form-group">
            <label class="form-label">Meetup Banner</label>
            <div class="upload-area" id="banner-area">
              <div id="banner-preview">
                <div style="font-size:2.5rem;margin-bottom:.5rem">🖼️</div>
                <p style="font-size:.88rem;color:var(--txt2)">Click or drag & drop a banner image</p>
                <p style="font-size:.72rem;color:var(--txt3);margin-top:.2rem">PNG · JPG · WEBP – max 10 MB</p>
              </div>
            </div>
            <input type="file" id="banner-input" accept="image/*" style="display:none">
          </div>

          <!-- Title -->
          <div class="form-group">
            <label class="form-label" for="f-title">Meetup Title *</label>
            <input type="text" id="f-title" class="form-control"
                   placeholder="e.g. Tech Talks: The Future of AI" required>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label" for="f-desc">Description</label>
            <textarea id="f-desc" class="form-control" rows="4"
                      placeholder="Describe what attendees can expect…"></textarea>
          </div>

          <!-- Date + Time -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-date">Date *</label>
              <input type="date" id="f-date" class="form-control" required>
            </div>
            <div class="form-group">
              <label class="form-label">Start & End Time *</label>
              <div style="display:flex;gap:.5rem;align-items:center">
                <input type="time" id="f-start" class="form-control" required>
                <span style="color:var(--txt3);flex-shrink:0">→</span>
                <input type="time" id="f-end" class="form-control" required>
              </div>
            </div>
          </div>

          <!-- Venue -->
          <div class="form-group">
            <label class="form-label" for="f-venue">Venue Name *</label>
            <input type="text" id="f-venue" class="form-control"
                   placeholder="e.g. Innovation Hub, 3rd Floor" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="f-maps">Google Maps Link</label>
            <input type="url" id="f-maps" class="form-control"
                   placeholder="https://maps.google.com/…">
          </div>

          <!-- Capacity + Deadline -->
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="f-cap">Capacity Limit *</label>
              <input type="number" id="f-cap" class="form-control"
                     placeholder="50" min="1" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="f-deadline">Registration Deadline *</label>
              <input type="datetime-local" id="f-deadline" class="form-control" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg" id="submit-btn"
                  style="margin-top:.5rem">
            ✨ Create Meetup
          </button>

        </div>
      </form>
    </div>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
