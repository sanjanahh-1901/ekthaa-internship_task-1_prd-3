<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Analytics – Converge</title>
  <meta name="description" content="Admin analytics: registrations, check-ins, attendance and history.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="analytics">

  <!-- NAV -->
  <nav class="navbar">
    <a href="/dashboard.html" class="navbar-brand">
      <div class="logo-icon">🎯</div>
      <span class="grad-text">Converge</span>
    </a>
    <div class="navbar-right">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm">← Dashboard</a>
      <div id="nav-user"></div>
    </div>
  </nav>

  <!-- CONTENT -->
  <div class="container" style="padding-top:2rem;padding-bottom:4rem">

    <div class="page-header fade-up">
      <h1 class="page-title" id="analytics-title">Meetup Analytics</h1>
      <p class="page-subtitle">Detailed insights and attendance data</p>
    </div>

    <!-- Stat Cards -->
    <div class="stats-grid fade-up-1">
      <div class="stat-card">
        <div class="stat-val" id="s-reg">–</div>
        <div class="stat-lbl">Registrations</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="s-cin">–</div>
        <div class="stat-lbl">Check-Ins</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="s-pct">–</div>
        <div class="stat-lbl">Attendance Rate</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="s-cap">–</div>
        <div class="stat-lbl">Capacity Limit</div>
      </div>
    </div>

    <!-- Export buttons -->
    <div style="display:flex;gap:.75rem;margin-bottom:2rem;flex-wrap:wrap" class="fade-up-2">
      <button class="btn btn-outline" id="exp-att">📥 Export Attendees CSV</button>
      <button class="btn btn-outline" id="exp-resp">📥 Export Responses CSV</button>
    </div>

    <!-- Analytics grid -->
    <div class="analytics-grid fade-up-3">

      <!-- Most active members -->
      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">🏆 Most Active Members</span>
        </div>
        <div class="card-body">
          <div id="active-list" class="attendee-list"></div>
        </div>
      </div>

      <!-- Meetup history table -->
      <div class="card">
        <div class="card-header">
          <span style="font-weight:700">📊 All Meetup History</span>
        </div>
        <div style="padding:0">
          <div class="tbl-wrap" style="border:none;border-radius:0">
            <table>
              <thead>
                <tr>
                  <th>Meetup</th>
                  <th>Date</th>
                  <th>Registered</th>
                  <th>Checked In</th>
                  <th>Rate</th>
                </tr>
              </thead>
              <tbody id="history-body">
                <tr>
                  <td colspan="5" style="text-align:center;color:var(--txt3);padding:2rem">
                    <span class="spinner"></span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="toast-wrap" class="toast-wrap"></div>
  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
