<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Converge – Sign In</title>
  <meta name="description" content="Join and manage tech meetups in your community. Connect, learn, and grow together.">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-up">

      <div class="auth-logo">
        <div class="auth-logo-icon">🎯</div>
        <h1 class="auth-title grad-text">Converge</h1>
        <p class="auth-subtitle">Connect · Learn · Grow Together</p>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Sign In</button>
        <button class="auth-tab"        data-tab="register">Create Account</button>
      </div>

      <!-- ── Login Form ── -->
      <form id="login-form">
        <div class="alert alert-err"></div>

        <div class="form-group">
          <label class="form-label" for="l-email">Email Address</label>
          <input type="email" id="l-email" class="form-control"
                 placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="l-pass">Password</label>
          <input type="password" id="l-pass" class="form-control"
                 placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg" id="login-submit-btn">
          Sign In →
        </button>

        <div class="demo-hint">
          🔑 Demo admin: <strong>admin@meetup.com</strong> / <strong>admin123</strong>
        </div>
      </form>

      <!-- ── Register Form ── -->
      <form id="register-form" style="display:none">
        <div class="alert alert-err"></div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="r-name">Full Name *</label>
            <input type="text" id="r-name" class="form-control" placeholder="John Doe" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="r-email">Email *</label>
            <input type="email" id="r-email" class="form-control" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="r-profession">Profession</label>
            <input type="text" id="r-profession" class="form-control" placeholder="Software Engineer">
          </div>
          <div class="form-group">
            <label class="form-label" for="r-company">Company</label>
            <input type="text" id="r-company" class="form-control" placeholder="Acme Corp">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="r-looking">What are you looking for?</label>
          <input type="text" id="r-looking" class="form-control"
                 placeholder="e.g. Collaborators, Mentorship, Jobs…">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="r-pass">Password *</label>
            <input type="password" id="r-pass" class="form-control"
                   placeholder="Min 6 chars" required minlength="6">
          </div>
          <div class="form-group">
            <label class="form-label" for="r-conf">Confirm Password *</label>
            <input type="password" id="r-conf" class="form-control"
                   placeholder="Repeat password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          Create Account →
        </button>
      </form>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
